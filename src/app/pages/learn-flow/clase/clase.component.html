<section>
    <div class="container">
        <!-- Breadcrumb -->
        <nav class="py-4" aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                    <a href="/learn-flow/main">
                        <i class="bi bi-house"></i> Home</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="/learn-flow/main">
                        <i class="bi bi-journals"></i> Cursos</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="/learn-flow/cursos/{{clase?.curso_id}}">
                        <i class="bi bi-book-half"></i> {{clase?.curso_titulo}}</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    <i class="bi bi-eyeglasses"></i>
                    {{clase?.titulo}}
                </li>
            </ol>
        </nav>

        <h2>{{clase?.titulo}}</h2>
        <p>{{clase?.descripcion}}</p>

        <div class="row">
            <div class="col-lg-12">
                <app-recursos-clase [clase]="clase!" class="recurso-clase"></app-recursos-clase>
            </div>
        </div>
    </div>
</section>
