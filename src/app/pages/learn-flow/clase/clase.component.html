<section style="margin-top: 5em;" class="jarallax pt-2 pt-lg-3 pb-lg-5" data-speed="0.35" data-bs-theme="light">
    <span class="position-absolute top-0 start-0 w-100 h-100 opacity-70"></span>

    <div class="container position-relative zindex-5 pb-5">

        <!-- Breadcrumb -->
        <nav class="py-4" aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                    <a routerLink="/"><i class="bx bx-home-alt fs-lg me-1"></i>Home</a>
                </li>
                <li class="breadcrumb-item">
                    <a routerLink="/learn-flow/cursos">Cursos</a>
                </li>
                <li class="breadcrumb-item" aria-current="page">Titulo del curso</li>
                <li class="breadcrumb-item active" aria-current="page">{{clase?.titulo}}</li>
            </ol>
        </nav>

        <h2>{{clase?.titulo}}</h2>
        <p>{{clase?.descripcion}}</p>

        <div class="row">
            <div class="col-lg-12">
                <div class="recursos-clase">
                    
                    <div *ngFor="let recurso of clase?.recursos" class="recurso-item">
                        <h3>{{recurso.titulo}}</h3>
                        
                        <ng-container [ngSwitch]="recurso.tipo">
                            <ng-container *ngSwitchCase="'video'">
                                <video width="100%" controls>
                                    <source [src]="recurso.url_archivo" type="video/mp4">
                                    Tu navegador no soporta el video.
                                </video>
                            </ng-container>
                            <ng-container *ngSwitchCase="'pdf'">
                                <h3>Material PDF</h3>
                                <iframe [src]="recurso.url_archivo" width="100%" height="500px"></iframe>
                            </ng-container>
                            <ng-container *ngSwitchCase="'audio'">
                                <audio controls>
                                    <source [src]="recurso.url_archivo" type="audio/mpeg">
                                    Tu navegador no soporta audio.
                                </audio>
                            </ng-container>
                            <ng-container *ngSwitchDefault>
                                Default case.
                            </ng-container>
                        </ng-container>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
