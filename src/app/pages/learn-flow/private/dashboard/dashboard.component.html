<section class="min-vh-100">
    <div class="container">
        <h1>Dashboard</h1>

        <h3>Cursos asignados</h3>
        <ol class="list-group list-group-numbered">
            <li *ngFor="let curso of cursosAsignados" class="list-group-item d-flex justify-content-between align-items-start">
                <div class="ms-2 me-auto">
                    <div class="fw-bold">{{curso.titulo}}</div>
                    {{curso.descripcion_corta}}
                </div>
                <span class="badge text-bg-primary rounded-pill">{{curso.estado}}</span>
            </li>
        </ol>

    </div>
</section>
